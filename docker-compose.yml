services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sda
      POSTGRES_PASSWORD: sda
      POSTGRES_DB: sda
    ports: ["5432:5432"]
    volumes: ["sda_pg:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: ./apps/api
    environment:
      MOCK_MODE: "true"
      DATABASE_URL: postgresql+asyncpg://sda:sda@postgres:5432/sda
      REDIS_URL: redis://redis:6379/0
      SDA_JOB_MODE: inline
      SDA_STORAGE_SECRET: local-compose-secret
    ports: ["8000:8000"]
    depends_on: [postgres, redis]
  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_SDA_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]
  worker:
    build: ./apps/worker
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on: [redis]
volumes:
  sda_pg:
